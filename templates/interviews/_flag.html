{% comment %}Bayrak emojileri Windows'ta harf olarak göründüğü için satır içi SVG kullanılır.{% endcomment %}
{% if code == 'tr' %}
<svg class="flag" viewBox="0 0 30 20" width="36" height="24" aria-hidden="true" focusable="false">
    <rect width="30" height="20" fill="#E30A17"/>
    <circle cx="10.6" cy="10" r="5" fill="#fff"/>
    <circle cx="12" cy="10" r="4" fill="#E30A17"/>
    <polygon fill="#fff" points="14.1,10 16.7,9.2 15.1,11.4 15.1,8.6 16.7,10.8"/>
</svg>
{% else %}
<svg class="flag" viewBox="0 0 60 40" width="36" height="24" aria-hidden="true" focusable="false">
    <clipPath id="flag-uk-s"><path d="M0,0 v40 h60 v-40 z"/></clipPath>
    <clipPath id="flag-uk-t"><path d="M30,20 h30 v20 z v20 h-30 z h-30 v-20 z v-20 h30 z"/></clipPath>
    <g clip-path="url(#flag-uk-s)">
        <path d="M0,0 v40 h60 v-40 z" fill="#012169"/>
        <path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/>
        <path d="M0,0 L60,40 M60,0 L0,40" clip-path="url(#flag-uk-t)" stroke="#C8102E" stroke-width="5"/>
        <path d="M30,0 v40 M0,20 h60" stroke="#fff" stroke-width="12"/>
        <path d="M30,0 v40 M0,20 h60" stroke="#C8102E" stroke-width="7"/>
    </g>
</svg>
{% endif %}
